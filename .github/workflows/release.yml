name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Verify module
        run: go mod verify

      - name: Run tests
        run: go test -race ./...

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
